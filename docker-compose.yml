services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      # Hora de Uruguay para NOW(): se usa para saber si un partido ya se jugó.
      TZ: America/Montevideo
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Los scripts corren solo al crear el volumen: para repetirlos, docker compose down -v.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Por TCP y no por socket: mientras corren los scripts de init el servidor
      # no acepta conexiones TCP, así que no da healthy antes de que existan los usuarios.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  db_data:
